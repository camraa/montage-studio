# Publie automatiquement une mise à jour de Montage Studio à chaque envoi sur main.
# Les apps installées (toi + tes clients) la récupèrent toutes seules depuis les Releases de ce dépôt (public).
# Pour envoyer du code SANS publier : mets [no-maj] dans le message du commit.
# Aucun jeton à régler : le jeton intégré de GitHub Actions suffit (même dépôt).
name: Publier la mise à jour

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "studio/**"
      - "musiques/**"
      - "polices/**"
      - "intro.mp3"
      - "outro.mp3"
      - "icone.*"
  workflow_dispatch:

concurrency:
  group: publier-maj
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publier:
    if: "!contains(github.event.head_commit.message, '[no-maj]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # même Python que l'exe : les .pyc doivent correspondre
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish.py
